<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClownFish Extension — Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8f9fa; color: #111827; }
    h2 { color: #f97316; }
    .icons { display: flex; gap: 24px; align-items: flex-end; margin: 20px 0; flex-wrap: wrap; }
    .icon-wrap { text-align: center; }
    canvas { display: block; margin: 0 auto 8px; border-radius: 8px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    a { display: block; color: #f97316; text-decoration: none; padding: 5px 10px;
        border: 1px solid #f97316; border-radius: 4px; font-size: 12px; margin-top: 4px; }
    a:hover { background: #f97316; color: white; }
    p { color: #6b7280; }
    .note { background: #fff; border: 1px solid #e8eaed; border-radius: 8px;
            padding: 16px; margin: 16px 0; max-width: 480px; }
    .label { margin-bottom: 6px; font-size: 12px; color: #9ca3af; font-weight: 600; }
  </style>
</head>
<body>
  <h2>🐟 ClownFish — Icon Generator</h2>
  <p>Click each download link. Place all PNGs in the <code>icons/</code> folder, then reload the extension.</p>
  <div class="note">
    <strong>Steps:</strong><br>
    1. Open this file in Chrome<br>
    2. Click each "Download" link below<br>
    3. Move downloaded PNGs into <code>ClownFish/icons/</code><br>
    4. Go to <code>chrome://extensions</code> and click the ↻ reload button
  </div>
  <div class="icons" id="icons"></div>

  <script>
    const sizes = [16, 32, 48, 128];

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const s = size;

      // ── Rounded-rectangle background ──────────────────────────────────────
      const r = s * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(s - r, 0); ctx.quadraticCurveTo(s, 0, s, r);
      ctx.lineTo(s, s - r); ctx.quadraticCurveTo(s, s, s - r, s);
      ctx.lineTo(r, s);     ctx.quadraticCurveTo(0, s, 0, s - r);
      ctx.lineTo(0, r);     ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#f97316';
      ctx.fill();

      // Clownfish is drawn in white on the orange background.
      // Fish faces LEFT (head on left, tail on right).

      const fishCX  = s * 0.44;   // body center X
      const fishCY  = s * 0.52;   // body center Y
      const bodyRX  = s * 0.31;   // body half-width
      const bodyRY  = s * 0.26;   // body half-height

      // ── Tail fin (two lobes fanning right) ────────────────────────────────
      ctx.fillStyle = 'white';
      // Top lobe
      ctx.beginPath();
      ctx.moveTo(fishCX + bodyRX * 0.7, fishCY - bodyRY * 0.15);
      ctx.quadraticCurveTo(s * 0.86, fishCY - bodyRY * 1.1, s * 0.92, fishCY - bodyRY * 0.55);
      ctx.quadraticCurveTo(s * 0.80, fishCY - bodyRY * 0.05, fishCX + bodyRX * 0.7, fishCY + bodyRY * 0.15);
      ctx.closePath();
      ctx.fill();
      // Bottom lobe
      ctx.beginPath();
      ctx.moveTo(fishCX + bodyRX * 0.7, fishCY + bodyRY * 0.15);
      ctx.quadraticCurveTo(s * 0.86, fishCY + bodyRY * 1.1, s * 0.92, fishCY + bodyRY * 0.55);
      ctx.quadraticCurveTo(s * 0.80, fishCY + bodyRY * 0.05, fishCX + bodyRX * 0.7, fishCY - bodyRY * 0.15);
      ctx.closePath();
      ctx.fill();

      // ── Dorsal fin (top) ───────────────────────────────────────────────────
      ctx.beginPath();
      ctx.moveTo(fishCX - bodyRX * 0.35, fishCY - bodyRY * 0.9);
      ctx.quadraticCurveTo(fishCX + bodyRX * 0.1, fishCY - bodyRY * 1.8, fishCX + bodyRX * 0.45, fishCY - bodyRY * 0.9);
      ctx.closePath();
      ctx.fill();

      // ── Pectoral fin (small, lower) ────────────────────────────────────────
      ctx.beginPath();
      ctx.ellipse(fishCX, fishCY + bodyRY * 0.8, bodyRX * 0.22, bodyRY * 0.28, -0.5, 0, Math.PI * 2);
      ctx.fill();

      // ── Main body (ellipse) ────────────────────────────────────────────────
      ctx.beginPath();
      ctx.ellipse(fishCX, fishCY, bodyRX, bodyRY, 0, 0, Math.PI * 2);
      ctx.fill();

      // ── White stripe (vertical band — clownfish characteristic) ────────────
      // Clip to body, then fill an orange-tinted stripe so the stripe reads
      // as a slightly different shade on the white body
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(fishCX, fishCY, bodyRX, bodyRY, 0, 0, Math.PI * 2);
      ctx.clip();
      // Slightly warm stripe to suggest the classic orange/white pattern
      ctx.fillStyle = 'rgba(249, 115, 22, 0.22)';
      const stripeW = s * 0.10;
      const stripeX = fishCX + bodyRX * 0.10;
      ctx.fillRect(stripeX - stripeW / 2, 0, stripeW, s);
      ctx.restore();

      // ── Eye ────────────────────────────────────────────────────────────────
      const eyeX = fishCX - bodyRX * 0.60;
      const eyeY = fishCY - bodyRY * 0.18;
      const eyeR = s * 0.07;
      // Outer (dark)
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#7c2d12';
      ctx.fill();
      // Inner white glint
      ctx.beginPath();
      ctx.arc(eyeX + eyeR * 0.25, eyeY - eyeR * 0.25, eyeR * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
    }

    sizes.forEach(size => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      drawIcon(canvas, size);

      const wrap = document.createElement('div');
      wrap.className = 'icon-wrap';

      // Scale up for preview
      const previewSize = Math.max(size, 96);
      const preview = document.createElement('canvas');
      preview.width = previewSize;
      preview.height = previewSize;
      const pCtx = preview.getContext('2d');
      pCtx.imageSmoothingEnabled = size >= 48;
      pCtx.drawImage(canvas, 0, 0, previewSize, previewSize);
      wrap.appendChild(preview);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = `${size} × ${size}`;
      wrap.appendChild(label);

      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `icon${size}.png`;
      a.textContent = `Download icon${size}.png`;
      wrap.appendChild(a);

      document.getElementById('icons').appendChild(wrap);
    });
  </script>
</body>
</html>
